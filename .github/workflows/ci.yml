name: CI
on:
  push:
    branches: [main, master, 'phase*/**', 'track*/**', 'design/**', 'perf/**', 'research/**', 'quest/**']
    paths-ignore: ['docs/**', '**.md']  # docs-only pushes would cancel the run for real code
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}
  # Main keeps every run, so each landed commit gets a full result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      # The ASan+UBSan suite ran 35-60 minutes at -O0; -O1 and four tests at once cut it.
      asan_timeout_minutes: 120
      asan_cxx_flags: -O1
      test_parallel: 4
