name: CI
on:
  push:
    branches: [main, master, 'phase*/**', 'track*/**', 'design/**']
    paths-ignore: ['docs/**', '**.md']  # docs-only pushes would cancel the run for real code
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'  # nightly: flaky timing, and drift in libraries tracked at main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      # The ASan+UBSan suite runs 35-60 minutes; the default cap of 60 cancels it.
      asan_timeout_minutes: 120
